name: Fetch patent annuity fees

on:
  schedule:
    # Monday 01:00 UTC = 08:00 Bangkok, 30 min before the Claude routine fires
    - cron: "0 1 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4
      - run: python scripts/fetch_fees.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fee_data.json
          git diff --cached --quiet || git commit -m "chore: weekly fee data refresh"
          git push
